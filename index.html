<style>

*{box-sizing:border-box}

canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.st{background:var(--pn);border:1px solid #2b4f9a;border-radius:10px;padding:5px 6px;text-align:center;flex:1;min-width:0}
.st small{display:block;color:var(--mu);font-size:8px}.st b{font-size:15px;white-space:nowrap}
#bt{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
button{font:800 16px Orbitron,system-ui,sans-serif;color:#eafaff;background:#111b3b;border:1px solid var(--cy);border-radius:14px;min-height:56px;flex:1;max-width:120px;box-shadow:0 0 16px #00cfff33;touch-action:manipulation}
button:active{background:#1d3670;transform:scale(.97)}
button:focus-visible{outline:2px solid #fff}
.ib{min-height:34px;width:38px;font-size:14px;border-radius:10px;padding:0}
#controls{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;padding:0 18px}
@media(pointer:fine){#controls{display:none}}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:140px 22px 22px;background:#04051199}
.panel{max-height:calc(100vh - 165px);overflow-y:auto;width:min(400px,100%);padding:24px 20px;text-align:center;border:1px solid #6a43d9;border-radius:20px;background:linear-gradient(150deg,#101735f2,#080a1af2);box-shadow:0 0 40px #733dff55}
h1{font-size:clamp(34px,11vw,52px);line-height:.95;margin:0 0 10px;color:var(--cy);text-shadow:0 0 22px #00cfff;font-weight:800}
p{color:#cbd3ff;line-height:1.5;margin:10px 0;font-size:13px;font-family:system-ui,sans-serif}
.panel button{max-width:none;width:100%;margin-top:8px;font-size:15px;background:#17245a}
.row{display:flex;gap:8px}.row button{margin-top:8px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font:600 12px Orbitron,system-ui;text-align:left}
input[type=range]{width:50%;accent-color:#37eaff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.grid button{min-height:64px;font-size:18px;margin:0;padding:4px}.grid small{display:block;font-size:7px;color:#8f9bd6;margin-top:3px}
#yt{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:none;padding:9px 12px;border-radius:12px;background:#c4111dee;color:#fff;font:700 11px Orbitron,system-ui,sans-serif;text-decoration:none;box-shadow:0 0 18px #ff2b3a66}

#fkb{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:92px;height:92px;max-width:none;border-radius:50%;display:none;z-index:4;font-size:30px;border:3px solid #ffd84b;background:#17245aee;padding:0}
#fq{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;width:40px;height:36px;min-height:0;display:none;z-index:4;padding:0;font-size:14px;max-width:none}

body.xmas .st{border-color:#ffd84b;background:#0b1f14cc}body.xmas .st small{color:#ffd9a0}body.xmas .set b,body.xmas .panel b{color:#ffe9a8}

function fix(c){c.xp=c.xp||0;c.up=Object.assign({d:0,r:0,e:0},c.up);c.dl=c.dl||{n:0,s:0};c.bk=c.bk||[0,0,0,0];c.pr=c.pr||[0,0,0,0];c.rec=c.rec||[0,0,0,0];c.st=Object.assign({runs:0,gems:0,dist:0,kills:0},c.st);c.own=c.own||['s0','t0','a0'];c.eq=Object.assign({skin:'s0',trail:'t0',aura:'a0',weapon:'w0'},c.eq);if(!c.own.includes('w0'))c.own.push('w0');c.ach=c.ach||{};c.ev=Object.assign({tk:0,used:0,tokens:0,played:0,wins:0,goals:0,cups:0,brp:0,brw:0,brk:0},c.ev);c.bl=c.bl||null;c.sp=Object.assign({n:0,done:0},c.sp);if(c.ev.tk&&!c.ev.used){c.ev.used=1;['ev0','ev1'].forEach(i=>{if(!c.own.includes(i))c.own.push(i)})}return c}
function adopt(c){fix(c.W);const oe=Object.assign({},W.ev),oo=[...(W.own||[])];for(const k in W)delete W[k];Object.assign(W,c.W);for(const k in oe)W.ev[k]=Math.max(W.ev[k]||0,oe[k]||0);oo.forEach(i=>{if(/^ev/.test(i)&&!W.own.includes(i))W.own.push(i)});W.uid=U.uid;Object.assign(CFG,c.C||{});maxL=c.mx||1;best=c.b||0;try{localStorage.setItem('nr_w',JSON.stringify(W));localStorage.setItem('nr_cfg',JSON.stringify(CFG))}catch(e){}if(!S.on&&$('modal').style.display!=='none'){if(curP==='acc')accP();else if(curP!=='conf')menu()}}
function mergeW(a){fix(a);const m=(x,y)=>Math.max(x||0,y||0);W.nc=m(W.nc,a.nc);W.di=m(W.di,a.di);W.xp=m(W.xp,a.xp);W.rec=W.rec.map((v,i)=>m(v,a.rec[i]));W.pr=W.pr.map((v,i)=>m(v,a.pr[i]));W.bk=W.bk.map((v,i)=>m(v,a.bk[i]));for(const k in W.st)W.st[k]=m(W.st[k],a.st[k]);for(const k in W.up)W.up[k]=m(W.up[k],a.up[k]);W.own=[...new Set([...W.own,...a.own])];W.ach=Object.assign({},a.ach,W.ach);W.sp.n=m(W.sp.n,a.sp.n);W.sp.done=m(W.sp.done,a.sp.done);for(const k in W.ev)W.ev[k]=m(W.ev[k],a.ev[k]);if((a.dl.n||0)>(W.dl.n||0))W.dl=a.dl;if((a.t||0)>(W.t||0)){W.eq=a.eq;W.bl=a.bl}W.name=W.name||a.name}

async function push(){if(!U||!fb)return;setSY('sync','Guardando en la nube…');try{W.uid=U.uid;await fb.fs.setDoc(dref(),{d:JSON.stringify({W,C:CFG,mx:maxL,b:best}),t:Date.now()});setSY('ok','Guardado a las '+new Date().toTimeString().slice(0,5))}catch(e){setSY('err',em(e))}}
async function pull(){setSY('sync','Recuperando progreso…');try{const r=await fb.fs.getDoc(dref());if(!r.exists()){await push();return}const c=JSON.parse(r.data().d);if(!hasP(W)||W.uid===U.uid){if(!hasP(W)||(c.W.t||0)>=(W.t||0))adopt(c);else await push();setSY('ok','Progreso sincronizado');return}CF=c;setSY('ok','');confP()}catch(e){setSY('err',em(e))}}

function fcr(c,x,y,sz){let im=CIM[c.k];if(!im){im=CIM[c.k]=new Image();im.src=CR_SRC[c.k]}if(im.complete&&im.naturalWidth){const k=Math.min(sz/im.naturalWidth,sz/im.naturalHeight);ctx.drawImage(im,x+(sz-im.naturalWidth*k)/2,y+(sz-im.naturalHeight*k)/2,im.naturalWidth*k,im.naturalHeight*k)}}

function blSim(a,b){const p=1/(1+Math.exp(-(BR(a)-BR(b))/6)),w=Math.random()<p?a:b,l=Math.floor(Math.random()*4),g=l+1+Math.floor(Math.random()*3);return w===a?{a,b,sa:g,sb:l,w}:{a,b,sa:l,sb:g,w}}
function blNew(c){W.bl={club:c,cur:Object.keys(CLUBS).sort(()=>Math.random()-.5),r:0,hist:[],out:0,champ:0,winner:''};save();brutP()}
function blDone(win,sa,sb){const B=W.bl,me=B.club,i=B.cur.indexOf(me),rv=i%2?B.cur[i-1]:B.cur[i+1],ms=[],ws=[];
 for(let k=0;k<B.cur.length;k+=2){const a=B.cur[k],b=B.cur[k+1];if(a===me||b===me){const m=a===me?{a:me,b:rv,sa,sb,w:win?me:rv}:{a:rv,b:me,sa:sb,sb:sa,w:win?me:rv};ms.push(m);ws.push(m.w)}else{const m=blSim(a,b);ms.push(m);ws.push(m.w)}}
 B.hist.push(ms);let note;
 if(win){if(B.r===2){B.champ=1;B.winner=me;W.ev.cups++;note='<p>🏆 <b>¡CAMPEÓN DE LA BRUT LEAGUE!</b></p>'}else{B.cur=ws;B.r++;note='<p>✅ ¡Pasas a <b>'+RN[B.r]+'</b>!</p>'}}
 else{B.out=1;let c=ws;while(c.length>1){const n=[],ms2=[];for(let k=0;k<c.length;k+=2){const m=blSim(c[k],c[k+1]);ms2.push(m);n.push(m.w)}B.hist.push(ms2);c=n}B.winner=c[0];note='<p>❌ Eliminado en '+RN[B.r]+'. Campeón: <b>'+CLUBS[B.winner].n+'</b></p>'}
